name: release
run-name: publish ${{ github.event.client_payload.publication_id }}
#
# What this ships:
#   1. Multi-arch container image (linux/amd64 + linux/arm64) at
#      ghcr.io/clavenar/clavenar-lite:{version}.
#   2. Static linux-x86_64 and linux-aarch64 binaries (musl) as release assets,
#      each with its own mandatory checksum, for
#      partners who want the binary outside a container.
#   3. A GitHub release with the matching CHANGELOG.md section as
#      the release body.
#
on:
  repository_dispatch:
    types: [clavenar-protected-publication]

permissions:
  contents: write   # required for `gh release create`
  packages: write   # required to push to ghcr.io

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Attach retained self-hosted checkout commit
        run: |
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" branch --force clavenar-runner-retained HEAD
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.client_payload.source_sha }}

      - name: Prepare isolated Rust toolchain state
        run: |
          suffix="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          job_home="$RUNNER_TEMP/home-$suffix"
          install -d -m 0700 "$job_home"
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home-$suffix"
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-home-$suffix"
          } >> "$GITHUB_ENV"

      - name: Verify protected publication input
        id: ver
        env:
          COMPONENT_VERSION: ${{ github.event.client_payload.component_version }}
          RELEASE_REFERENCE: ${{ github.event.client_payload.release_reference }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          test "$GITHUB_ACTOR" = "vanteguardlabs"
          [[ "$RELEASE_REFERENCE" =~ ^ghcr\.io/clavenar/clavenar-stack-release@sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          TAG="$COMPONENT_VERSION"
          CARGO_VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::protected component version $TAG does not match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        env:
          HOME: ${{ runner.temp }}/home-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Verify the exact Lite source before publication
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/clavenar/clavenar-lite:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract CHANGELOG section for this version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Pull the lines from "## [VERSION]" up to (not including) the
          # next "## [" header. We use `index($0, hdr)` for a literal
          # substring match — the alternative regex form ($0 ~ ...)
          # treats brackets as a character class and silently matches
          # nothing for `[X.Y.Z]`-style version headers.
          awk -v hdr="## [$VERSION] -" \
              'index($0, hdr) == 1 { flag=1; print; next }
               /^## \[/ && flag { exit }
               flag' \
              CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no CHANGELOG section found for $VERSION"
            exit 1
          fi
          echo "---release-notes.md---"
          cat release-notes.md

      - name: Build static Linux release assets
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release-assets
          for specification in amd64:x86_64 arm64:aarch64; do
            platform="${specification%%:*}"
            architecture="${specification##*:}"
            output="$RUNNER_TEMP/clavenar-lite-$architecture"
            package="$RUNNER_TEMP/package-$architecture"
            docker buildx build \
              --platform "linux/$platform" \
              --target static-binary \
              --output "type=local,dest=$output" \
              .
            file "$output/clavenar-lite" | tee "$RUNNER_TEMP/file-$architecture.txt"
            grep -Eq 'statically linked|static-pie linked' \
              "$RUNNER_TEMP/file-$architecture.txt"
            mkdir -p "$package"
            install -m 0755 "$output/clavenar-lite" "$package/clavenar-lite"
            install -m 0644 LICENSE NOTICE "$package/"
            asset="clavenar-lite-${VERSION}-${architecture}-linux-musl.tar.gz"
            tar --sort=name --mtime='UTC 1970-01-01' \
              --owner=0 --group=0 --numeric-owner \
              -czf "release-assets/$asset" -C "$package" \
              LICENSE NOTICE clavenar-lite
            (
              cd release-assets
              sha256sum "$asset" > "$asset.sha256"
            )
          done
          install -m 0755 scripts/install.sh release-assets/install.sh
          install -m 0755 scripts/uninstall.sh release-assets/uninstall.sh
          (
            cd release-assets
            sha256sum install.sh > install.sh.sha256
            sha256sum uninstall.sh > uninstall.sh.sha256
          )

      - name: Verify native install, upgrade, and uninstall lifecycle
        run: scripts/smoke-native-install.sh "${{ steps.ver.outputs.version }}" release-assets release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha')" = "$SOURCE_SHA"
            gh release upload "$tag" release-assets/* --clobber
          else
            existing="$(git ls-remote --refs origin "refs/tags/$tag" |
              awk '{print $1}')"
            if [ -n "$existing" ]; then
              test "$existing" = "$SOURCE_SHA"
            else
              git push origin "$SOURCE_SHA:refs/tags/$tag"
            fi
            gh release create "$tag" --verify-tag \
              --title "$tag — clavenar-lite" \
              --notes-file release-notes.md \
              release-assets/*
          fi
